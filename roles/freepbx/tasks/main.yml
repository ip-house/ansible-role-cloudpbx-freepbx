---
- name: Downloading FreePBX {{ fpbx_release }}
  ansible.builtin.get_url:
    url: https://mirror.freepbx.org/modules/packages/freepbx/freepbx-{{ fpbx_release }}.tgz
    dest: /usr/src/freepbx-{{ fpbx_release }}.tgz
    checksum: sha256:{{ fpbx_sha256 }}
    mode: '0664'

- name: Unpacking FreePBX tarball
  ansible.builtin.unarchive:
    src: /usr/src/freepbx-{{ fpbx_release }}.tgz
    dest: /usr/src
    remote_src: true
    creates: /usr/src/freepbx/install

- name: Check if FreePBX is installed
  ansible.builtin.stat:
    path: /etc/freepbx.conf
  register: freepbx_conf

# The installer replaces these with symlinks into /var/www/html
- name: Creating some asterisk files
  ansible.builtin.file:
    path: /etc/asterisk/{{ item }}.conf
    state: touch
    mode: '0664'
  with_items:
    - modules
    - cdr
  when: not freepbx_conf.stat.exists

- name: Starting FreePBX
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      ./start_asterisk start
      ./install -n --dbuser root --dbpass "$FPBX_DB_PASS"
    chdir: /usr/src/freepbx
    creates: /etc/freepbx.conf
    executable: /bin/bash
  environment:
    FPBX_DB_PASS: "{{ db_root_pass }}"
  register: freepbx_install

- name: Create cloudpbx state folder
  ansible.builtin.file:
    path: /var/lib/cloudpbx
    state: directory
    mode: '0755'

- name: Install FreePBX Modules
  ansible.builtin.shell: "{{ item }}"
  args:
    creates: /var/lib/cloudpbx/fpbx-modules.ok
    executable: /bin/bash
  with_items:
    - fwconsole ma enablerepo standard
    - fwconsole ma enablerepo extended
    - fwconsole ma downloadinstall arimanager
    - fwconsole ma downloadinstall framework
    - fwconsole ma downloadinstall filestore
    - fwconsole ma downloadinstall calendar
    - fwconsole ma downloadinstall announcement
    - fwconsole ma downloadinstall asterisk-cli
    - fwconsole ma downloadinstall asteriskinfo
    - fwconsole ma downloadinstall backup
    - fwconsole ma downloadinstall iaxsettings
    - fwconsole ma downloadinstall configedit
    - fwconsole ma downloadinstall ivr
    - fwconsole ma downloadinstall miscdests
    - fwconsole ma downloadinstall outroutemsg
    - fwconsole ma downloadinstall timeconditions
    - fwconsole ma downloadinstall queues
    - fwconsole ma upgradeall
    - fwconsole reload
    - fwconsole restart
    - fwconsole chown
    - touch /var/lib/cloudpbx/fpbx-modules.ok

- name: Create FreePBX Startup service
  ansible.builtin.template:
    src: freepbx.service.j2
    dest: /etc/systemd/system/freepbx.service
    mode: '0664'

- name: Enable FreePBX Service
  ansible.builtin.service:
    name: freepbx.service
    enabled: true

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ fpbx_hostname }}"

- name: Add hostname to /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ fpbx_hostname }} {{ fpbx_hostname.split('.')[0] }}"

- name: Create FreePBX update settings script
  ansible.builtin.template:
    src: update-settings.php.j2
    dest: /usr/local/sbin/cloudpbx-fpbx-update-settings.php
    owner: root
    group: asterisk
    mode: '0640'

# Runs as asterisk so FreePBX does not leave root-owned cache files behind
- name: Apply FreePBX update settings
  ansible.builtin.command: runuser -u asterisk -- php /usr/local/sbin/cloudpbx-fpbx-update-settings.php
  register: freepbx_update_settings
  changed_when: freepbx_update_settings.stdout == 'changed'

- name: Reboot host after FreePBX install
  ansible.builtin.reboot:
  when: freepbx_install is changed
