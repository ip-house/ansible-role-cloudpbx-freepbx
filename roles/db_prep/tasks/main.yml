---
-
  name: Check DB root password is set
  ansible.builtin.assert:
    that:
      - db_root_pass is defined
      - db_root_pass | length > 0
    fail_msg: Set DB_ROOT_PASS in the environment
-
  name: Change DB listener from localhost to all interfaces
  ansible.builtin.replace:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '127.0.0.1'
    replace: '0.0.0.0'
  notify: Restart mysql
-
  name: Disable Strict Trans Tables mode
  ansible.builtin.lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    insertafter: [mysqld]
    line: sql_mode=''
  notify: Restart mysql

## START: Secure DB
-
  name: Secure DB - Set root password
  community.mysql.mysql_user:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_user: "root"
    login_password: "{{ db_root_pass }}"
    name: root
    host: "{{ item }}"
    password: "{{ db_root_pass }}"
    state: present
  no_log: true
  with_items:
    - 127.0.0.1
    - ::1
    - localhost
-
  name: Secure DB - delete anonymous users
  community.mysql.mysql_user:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_user: "root"
    login_password: "{{ db_root_pass }}"
    name: ""
    host: "{{ item }}"
    state: absent
  no_log: true
  with_items:
    - localhost
    - "{{ ansible_nodename }}"
-
  name: Secure DB - delete hostname based root
  community.mysql.mysql_user:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_user: "root"
    login_password: "{{ db_root_pass }}"
    name: root
    host: "{{ ansible_nodename }}"
    state: absent
  no_log: true
-
  name: Secure DB - Remove Test DB
  community.mysql.mysql_db:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_user: "root"
    login_password: "{{ db_root_pass }}"
    name: test
    state: absent
  no_log: true
-
  name: Disable linux socket root login
  community.mysql.mysql_query:
    login_user: "root"
    login_password: "{{ db_root_pass }}"
    query: UPDATE mysql.user SET plugin = '' WHERE user = 'root' AND host = 'localhost'
  no_log: true
  ignore_errors: true
## END Secure DB

- name: Apply pending mysql changes
  ansible.builtin.meta: flush_handlers
