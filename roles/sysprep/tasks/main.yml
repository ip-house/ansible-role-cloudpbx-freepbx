---
- name: Check supported Ubuntu release
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version in ['22.04', '24.04']
    fail_msg: This playbook supports Ubuntu 22.04 and 24.04 only

- name: Check customer name
  ansible.builtin.assert:
    that:
      - customer_name is match('^[a-z0-9]([a-z0-9-]{0,48}[a-z0-9])?$')
    fail_msg: Customer name must be lowercase letters, digits and dashes (e.g. balkan-hidraulik)

- name: Remove legacy NodeSource repo definition before apt refresh
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/nodesource.list
    state: absent

- name: Remove legacy NodeSource trusted key
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d/nodesource.asc
    state: absent

- name: Initial system upgrade
  ansible.builtin.apt:
    upgrade: full
    update_cache: true
  register: sysprep_initial_upgrade
  until: sysprep_initial_upgrade is succeeded
  retries: 5
  delay: 30

- name: Install php{{ php_ver }} install prerequisite
  ansible.builtin.apt:
    name: software-properties-common
    state: present

- name: Add php{{ php_ver }} repo
  ansible.builtin.apt_repository:
    repo: ppa:ondrej/php

- name: Updating System
  ansible.builtin.apt:
    upgrade: full
    update_cache: true
  register: sysprep_upgrade
  until: sysprep_upgrade is succeeded
  retries: 5
  delay: 30

- name: Installing Packages
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
  register: sysprep_packages
  until: sysprep_packages is succeeded
  retries: 5
  delay: 30

- name: Get default php
  ansible.builtin.command: readlink -f /etc/alternatives/php
  register: sysprep_php_alternative
  changed_when: false

- name: Set php{{ php_ver }} as default
  ansible.builtin.command: update-alternatives --set php /usr/bin/php{{ php_ver }}
  when: sysprep_php_alternative.stdout != '/usr/bin/php' ~ php_ver

- name: Set swappiness
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    line: vm.swappiness=10
    backup: true
    state: present

- name: Install Legacy Pear Requirements
  ansible.builtin.shell:
    cmd: pear install Console_Getopt
    creates: /usr/share/php/Console/Getopt.php
  when: fpbx_ver == '15.0'
  ignore_errors: true

- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: sysprep_reboot_required

- name: Reboot host
  ansible.builtin.reboot:
  when: sysprep_reboot_required.stat.exists
